basePath: /api/v1
definitions:
  github_com_karlo_notification-service_internal_platform_response.Meta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      totalPages:
        type: integer
      totalRows:
        type: integer
    type: object
host: localhost:5004
info:
  contact:
    email: engineering@karlo.co.id
    name: Karlo Engineering
  description: 'The single outbound-messaging boundary: in-app, push, email and WhatsApp,
    plus OTP and support tickets.\n\nMost traffic arrives over gRPC from other services.
    These HTTP endpoints serve a user''s own inbox, the OTP flow, and the WhatsApp
    webhook.'
  termsOfService: https://karlo.co.id/terms
  title: Karlo Notification API
  version: "1.0"
paths:
  /notifications:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_karlo_notification-service_internal_platform_response.Meta'
      security:
      - BearerAuth: []
      summary: List notifications
      tags:
      - Notifications
  /notifications/read:
    post:
      responses:
        "200":
          description: OK
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Mark notifications read
      tags:
      - Notifications
  /notifications/unread:
    get:
      responses:
        "200":
          description: OK
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Count unread notifications
      tags:
      - Notifications
  /otp/send:
    post:
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Send an OTP
      tags:
      - OTP
  /otp/verify:
    post:
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Verify an OTP
      tags:
      - OTP
  /webhooks/whatsapp:
    get:
      responses: {}
      summary: Verify the WhatsApp webhook
      tags:
      - Webhooks
    post:
      responses: {}
      summary: Receive WhatsApp events
      tags:
      - Webhooks
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: RS256 access token issued by the authentication service, as "Bearer
      <token>".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
